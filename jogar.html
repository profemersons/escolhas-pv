<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>E AGORA? — Resposta</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="player-page">
<main class="player-shell">

  <header class="player-header">
    <div>
      <div class="mini-brand">E AGORA?</div>
      <div id="playerName" class="player-name"></div>
    </div>
    <div id="phase" class="phase-badge">AGUARDANDO</div>
  </header>

  <section id="waiting" class="card waiting-card">
    <div class="waiting-symbol">✦</div>
    <div class="eyebrow">VOCÊ ESTÁ NA PARTIDA</div>
    <h1 id="waitingTitle">Tudo pronto!</h1>
    <p id="waitingText">Olhe para a tela projetada e aguarde o professor liberar a próxima situação.</p>
    <div class="waiting-pulse"></div>
  </section>

  <section id="answerArea" class="answer-screen" hidden>
    <div class="progress-meta">
      <span id="round">RODADA 1 DE 8</span>
      <span>ESCOLHA 1</span>
    </div>
    <div class="progress-track"><i id="progressFill"></i></div>

    <div class="card question-card">
      <div class="question-kicker">SUA VEZ</div>
      <h1 id="questionTitle">Escolha uma alternativa</h1>
      <p id="questionHint"></p>

      <div id="buttons" class="answer-buttons"></div>

      <div id="sent" class="sent" hidden></div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/aluno.js"></script>
</body>
</html>
