<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>E AGORA? — Projeto de Vida</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="join-page">
<main class="join-shell">
  <section class="join-hero">
    <div class="game-mark">?</div>
    <div class="eyebrow">PROJETO DE VIDA · JOGO</div>
    <h1>E<br><span>AGORA?</span></h1>
    <p>Suas escolhas contam uma história. Vamos descobrir qual.</p>
  </section>

  <section class="card join-card">
    <div class="input-group">
      <label for="code">Código da partida</label>
      <input id="code" maxlength="20" placeholder="Digite o código" autocomplete="off" autocapitalize="characters">
    </div>

    <div class="input-group">
      <label for="name">Como quer aparecer?</label>
      <input id="name" maxlength="40" placeholder="Nome ou apelido" autocomplete="off">
    </div>

    <button id="join" class="primary-btn">
      <span>ENTRAR NO JOGO</span><b>→</b>
    </button>

    <div id="message"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const codeInput = document.querySelector("#code");

codeInput.addEventListener("input", e => {
  e.target.value = e.target.value
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");
});

document.querySelector("#join").onclick = async () => {
  const code = codeInput.value.trim().toUpperCase();
  const name = document.querySelector("#name").value.trim();

  if (!code || !name) {
    showMessage("Preencha o código e seu nome.", "error");
    return;
  }

  const button = document.querySelector("#join");
  button.disabled = true;
  button.querySelector("span").textContent = "ENTRANDO...";

  try {
    const game = await getGameByCode(code);

    if (game.status === "finished") {
      throw new Error("Essa partida já terminou.");
    }

    const { data: existing } = await supabaseClient
      .from("players")
      .select("*")
      .eq("game_id", game.id)
      .eq("name", name)
      .maybeSingle();

    let player = existing;

    if (!player) {
      const result = await supabaseClient
        .from("players")
        .insert({ game_id: game.id, name })
        .select()
        .single();

      if (result.error) throw result.error;
      player = result.data;
    }

    setGameCode(code);
    setPlayerId(player.id);
    setPlayerName(player.name);

    location.href = "jogar.html";

  } catch (e) {
    console.error(e);
    showMessage(e.message || "Não foi possível entrar na partida.", "error");
    button.disabled = false;
    button.querySelector("span").textContent = "ENTRAR NO JOGO";
  }
};
</script>
</body>
</html>
